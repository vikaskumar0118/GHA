name: Variables in GitHub Actions

on:
  push:
    branches: ['main']
  workflow_dispatch:

env:
  BASEAPI: 'http://baseurl.api/'

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      BASEAPI: 'http://baseurl.api/'

    steps:
      - name: All types of secrets and variables
        run: |
          echo "Base API URL: $BASEAPI"
          echo "Workflow variables: Add other actions to build,"
          echo "test, and deploy your project."
          echo "configuration variable | Version of App is ${{vars.VERSION}}"
          echo "configuration secrets | Secrete key is ${{secrets.KEY}}"
        env:
          BASEAPI: 'http://baseurl.api/'
